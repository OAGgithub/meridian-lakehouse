[project]
name = "meridian-lakehouse"
version = "0.1.0"
description = "Retail bank lakehouse on Databricks — bronze/silver/gold with run observability."
readme = "README.md"
authors = [{ name = "Oniel Guzman", email = "oniel.gg@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "faker>=38.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
